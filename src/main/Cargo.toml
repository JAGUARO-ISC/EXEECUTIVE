[package]
name = "executive"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.4.0", features = ["shell-open", "system-tray", "notification-all"] }
tauri-plugin-positioner = "2.4.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
chrono = "0.4.38"
anyhow = "1.0.86"
log = "0.4.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
